{% extends "base.html" %}

{% block title %}Login - {{ panel_name }}{% endblock %}

{% block auth_content %}
<div class="w-full max-w-md">
    <div class="bg-card border border-card rounded-2xl p-8 card">
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-primary-600 flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2 4h.01M17 16h.01"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold">{{ panel_name }}</h1>
            <p class="text-muted mt-1">Sign in to your account</p>
        </div>

        <form method="POST" class="space-y-5">
            <div>
                <label for="username" class="block text-sm font-medium mb-1.5">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username"
                       class="input-field w-full px-4 py-3 rounded-lg text-sm focus:ring-2 focus:ring-primary-500"
                       placeholder="Enter your username">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium mb-1.5">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password"
                       class="input-field w-full px-4 py-3 rounded-lg text-sm focus:ring-2 focus:ring-primary-500"
                       placeholder="Enter your password">
            </div>

            <button type="submit" class="btn-primary w-full py-3 rounded-lg font-medium text-sm hover:shadow-lg transition-shadow">
                Sign In
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-muted">
            <p>Don't have an account? <a href="{{ url_for('register') }}" class="text-primary-500 hover:underline">Register</a></p>
        </div>
    </div>
</div>
{% endblock %}
